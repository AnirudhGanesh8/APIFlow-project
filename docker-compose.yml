services:
  postgres:
    image: postgres:16-alpine
    container_name: apiflow-postgres
    environment:
      POSTGRES_DB: apiflow
      POSTGRES_USER: apiflow
      POSTGRES_PASSWORD: apiflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apiflow -d apiflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: apiflow-backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://apiflow:apiflow@postgres:5432/apiflow
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
